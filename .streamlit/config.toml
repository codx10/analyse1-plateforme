# Thème sombre de la plateforme.
# Streamlit lit ce fichier automatiquement quand on lance la commande
# depuis le dossier du projet.
[theme]
base = "dark"
primaryColor = "#4c8dff"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b26"
textColor = "#e6edf3"
font = "sans serif"

[browser]
gatherUsageStats = false
